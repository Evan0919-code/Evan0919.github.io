<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Depo Xona - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #FFFFFF 0%, #FFA500 50%, #FFFFFF 100%);
            min-height: 100vh;
        }

        .navbar.navbar-dark.bg-primary { 
            background: linear-gradient(135deg, #FFA500 0%, #DDA0DD 100%) !important;
        }

        .card { 
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(221, 160, 221, 0.2);
        }

        .btn-primary { 
            background: linear-gradient(135deg, #FFA500 0%, #FFD700 100%) !important;
            border: none;
        }

        .btn-primary:hover { 
            background: linear-gradient(135deg, #E69500 0%, #DDA0DD 100%) !important;
        }

        .btn-info { 
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border: none;
        }

        .form-control:focus { 
            border-color: #DDA0DD;
            box-shadow: 0 0 0 0.2rem rgba(221, 160, 221, 0.25);
        }

        .carousel-item img {
            height: 400px;
            object-fit: cover;
        }

        footer {
            background: linear-gradient(135deg, #FFA500 0%, #FF8C00 100%);
            color: white;
            padding: 20px 0;
            margin-top: 40px;
        }

        footer a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
        }

        .logo-header {
            width: 50px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-house-fill"></i> Depo Xona
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cursos.html">Cursos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="eventos.html">Eventos</a>
                    </li>
                    <li class="nav-item" id="inscripcion-nav" style="display:none;">
                        <a class="nav-link" href="inscripcion.html">Mis Inscripciones</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="auth-link" href="login_usuario.html">Login</a>
                    </li>
                    <li class="nav-item" id="logout-nav" style="display:none;">
                        <a class="nav-link" href="#" onclick="logout()">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">
        <div class="row mb-4">
            <div class="col-lg-12">
                <h1 class="text-center mb-4" style="color: #6b4a7f;">Bienvenido a Depo Xona</h1>
                <p class="text-center text-secondary">Explora nuestros cursos y eventos deportivos</p>
            </div>
        </div>

        <!-- Carrusel de Eventos -->
        <div class="row mb-5">
            <div class="col-lg-12">
                <div id="eventosCarousel" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner" id="carouselContent">
                        <!-- Cargado por JavaScript -->
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#eventosCarousel" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#eventosCarousel" data-bs-slide="next">
                        <span class="carousel-control-next-icon"></span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Últimos Cursos -->
        <div class="row mb-5">
            <div class="col-lg-12">
                <h2 class="mb-4" style="color: #6b4a7f;"><i class="bi bi-book"></i> Últimos Cursos</h2>
                <div id="cursosContainer" class="row">
                    <!-- Cargado por JavaScript -->
                </div>
            </div>
        </div>

        <!-- Últimos Eventos -->
        <div class="row mb-5">
            <div class="col-lg-12">
                <h2 class="mb-4" style="color: #6b4a7f;"><i class="bi bi-calendar-event"></i> Últimos Eventos</h2>
                <div id="eventosContainer" class="row">
                    <!-- Cargado por JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center mt-5">
        <div class="container">
            <p>&copy; 2024 Depo Xona. Todos los derechos reservados.</p>
            <div>
                <a href="#"><i class="bi bi-facebook"></i></a>
                <a href="#"><i class="bi bi-twitter"></i></a>
                <a href="#"><i class="bi bi-instagram"></i></a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadIndex();
        });

        function loadIndex() {
            const cursos = getDataCursos().slice(0, 3);
            const eventos = getDataEventos().slice(0, 3);

            // Carrusel
            const carousel = document.getElementById('carouselContent');
            eventos.forEach((evento, idx) => {
                const itemClass = idx === 0 ? 'carousel-item active' : 'carousel-item';
                carousel.innerHTML += `
                    <div class="${itemClass}">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">${evento.nombre}</h5>
                                <p class="card-text">${evento.descripcion}</p>
                                <p class="text-muted"><strong>Curso:</strong> ${evento.curso}</p>
                                <a href="eventos.html?id=${evento.id}" class="btn btn-primary">Ver Detalles</a>
                            </div>
                        </div>
                    </div>
                `;
            });

            // Cursos
            const cursosContainer = document.getElementById('cursosContainer');
            cursos.forEach(curso => {
                cursosContainer.innerHTML += `
                    <div class="col-md-4 mb-4">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">${curso.nombre}</h5>
                                <p class="card-text">${curso.descripcion || 'Curso disponible'}</p>
                                <a href="cursos.html?id=${curso.id}" class="btn btn-primary">Ver Detalles</a>
                            </div>
                        </div>
                    </div>
                `;
            });

            // Eventos
            const eventosContainer = document.getElementById('eventosContainer');
            eventos.forEach(evento => {
                eventosContainer.innerHTML += `
                    <div class="col-md-4 mb-4">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">${evento.nombre}</h5>
                                <p class="card-text">${evento.descripcion}</p>
                                <p class="text-muted"><strong>Curso:</strong> ${evento.curso}</p>
                                <a href="eventos.html?id=${evento.id}" class="btn btn-info">Ver Detalles</a>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
