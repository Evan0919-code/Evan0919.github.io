<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión - Depo Xona</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #FFFFFF 0%, #FFA500 50%, #FFFFFF 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card { 
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(221, 160, 221, 0.2);
            max-width: 400px;
            width: 100%;
        }

        .card-header { 
            background: linear-gradient(135deg, #FFA500 0%, #DDA0DD 100%);
            color: white;
            border-radius: 12px 12px 0 0;
            text-align: center;
            padding: 20px;
        }

        .btn-primary { 
            background: linear-gradient(135deg, #FFA500 0%, #FFD700 100%) !important;
            border: none;
            width: 100%;
        }

        .btn-primary:hover { 
            background: linear-gradient(135deg, #E69500 0%, #DDA0DD 100%) !important;
        }

        .form-control:focus { 
            border-color: #DDA0DD;
            box-shadow: 0 0 0 0.2rem rgba(221, 160, 221, 0.25);
        }

        .alert-danger { 
            background-color: #ffe6e6;
            color: #cc0000;
            border: 1px solid #FFA500;
        }

        .text-center a {
            color: #6b4a7f;
            text-decoration: none;
        }

        .text-center a:hover {
            text-decoration: underline;
        }

        .form-label {
            color: #6b4a7f;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h3 class="mb-0">
                    <i class="bi bi-lock"></i> Iniciar Sesión
                </h3>
            </div>
            <div class="card-body p-4">
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div id="alertError" class="alert alert-danger" style="display:none;"></div>

                    <div class="mb-3">
                        <label for="nombre" class="form-label"><i class="bi bi-person"></i> Nombre</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" required placeholder="Tu nombre completo">
                    </div>

                    <div class="mb-3">
                        <label for="telefono" class="form-label"><i class="bi bi-telephone"></i> Teléfono</label>
                        <input type="tel" class="form-control" id="telefono" name="telefono" required placeholder="10 dígitos">
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                    </button>
                </form>

                <hr class="my-4">

                <p class="text-center text-secondary mb-3">
                    ¿No tienes cuenta?
                </p>
                <a href="registro_usuario.html" class="btn btn-outline-primary w-100">
                    <i class="bi bi-person-plus"></i> Crear Cuenta
                </a>

                <p class="text-center mt-3">
                    <a href="index.html"><i class="bi bi-house-fill"></i> Volver al inicio</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Usuarios de prueba disponibles -->
    <div class="position-fixed bottom-0 end-0 p-3" style="display:none; background: rgba(0,0,0,0.8); color: white; border-radius: 8px; margin: 20px;">
        <small>Usuarios de prueba:<br>
        Nombre: Juan García<br>
        Teléfono: 5551234567<br><br>
        Nombre: María López<br>
        Teléfono: 5559876543</small>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const usuario = getUsuario();
            if (usuario) {
                window.location.href = 'index.html';
            }
        });

        function handleLogin(event) {
            event.preventDefault();

            const nombre = document.getElementById('nombre').value.trim();
            const telefono = document.getElementById('telefono').value.trim();
            const alertError = document.getElementById('alertError');

            if (!nombre || !telefono) {
                alertError.textContent = 'Completa todos los campos.';
                alertError.style.display = 'block';
                return;
            }

            const usuario = getUserByCredentials(nombre, telefono);
            
            if (usuario) {
                setUsuario(usuario);
                window.location.href = 'index.html';
            } else {
                alertError.textContent = 'Usuario o teléfono no encontrado. Verifica los datos.';
                alertError.style.display = 'block';
            }
        }
    </script>
</body>
</html>
