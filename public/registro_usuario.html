<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro - Depo Xona</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #FFF8E1 0%, #F0E6FF 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card { 
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(221, 160, 221, 0.2);
            max-width: 450px;
            width: 100%;
        }

        .card-header { 
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: white;
            border-radius: 12px 12px 0 0;
            text-align: center;
            padding: 20px;
        }

        .btn-primary { 
            background: linear-gradient(135deg, #FFA500 0%, #FFD700 100%) !important;
            border: none;
            width: 100%;
        }

        .btn-primary:hover { 
            background: linear-gradient(135deg, #E69500 0%, #DDA0DD 100%) !important;
        }

        .btn-success { 
            background: linear-gradient(135deg, #FFD700 0%, #DDA0DD 100%);
            border: none;
        }

        .form-control:focus { 
            border-color: #8a2be2;
            box-shadow: 0 0 0 0.2rem rgba(138, 43, 226, 0.25);
        }

        .alert-danger { 
            background-color: #ffe6e6;
            color: #cc0000;
            border: 1px solid #FFA500;
        }

        .alert-success {
            background-color: #e6ffe6;
            color: #00aa00;
            border: 1px solid #FFA500;
        }

        .text-center a {
            color: #6b4a7f;
            text-decoration: none;
        }

        .text-center a:hover {
            text-decoration: underline;
        }

        .form-label {
            color: #6b4a7f;
            font-weight: 600;
        }

        .form-text {
            color: #999;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h3 class="mb-0">
                    <i class="bi bi-person-plus"></i> Crear Cuenta
                </h3>
            </div>
            <div class="card-body p-4">
                <form id="registroForm" onsubmit="handleRegistro(event)">
                    <div id="alertError" class="alert alert-danger" style="display:none;"></div>
                    <div id="alertSuccess" class="alert alert-success" style="display:none;"></div>

                    <div class="mb-3">
                        <label for="nombre" class="form-label"><i class="bi bi-person"></i> Nombre Completo</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" required placeholder="Tu nombre completo">
                        <small class="form-text">Ingresa tu nombre y apellido</small>
                    </div>

                    <div class="mb-3">
                        <label for="telefono" class="form-label"><i class="bi bi-telephone"></i> Teléfono</label>
                        <input type="tel" class="form-control" id="telefono" name="telefono" required placeholder="10 dígitos" pattern="[0-9]{10}">
                        <small class="form-text">Debe tener exactamente 10 dígitos</small>
                    </div>

                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-circle"></i> Registrarse
                    </button>
                </form>

                <hr class="my-4">

                <p class="text-center text-secondary mb-3">
                    ¿Ya tienes cuenta?
                </p>
                <a href="login_usuario.html" class="btn btn-outline-primary w-100">
                    <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                </a>

                <p class="text-center mt-3">
                    <a href="index.html"><i class="bi bi-house-fill"></i> Volver al inicio</a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const usuario = getUsuario();
            if (usuario) {
                window.location.href = 'index.html';
            }
        });

        function handleRegistro(event) {
            event.preventDefault();

            const nombre = document.getElementById('nombre').value.trim();
            const telefono = document.getElementById('telefono').value.trim();
            const alertError = document.getElementById('alertError');
            const alertSuccess = document.getElementById('alertSuccess');

            alertError.style.display = 'none';
            alertSuccess.style.display = 'none';

            if (!nombre || !telefono) {
                alertError.textContent = 'Completa todos los campos.';
                alertError.style.display = 'block';
                return;
            }

            if (!/^\d{10}$/.test(telefono)) {
                alertError.textContent = 'El teléfono debe tener exactamente 10 dígitos.';
                alertError.style.display = 'block';
                return;
            }

            const usuarioExistente = getUserByCredentials(nombre, telefono);
            if (usuarioExistente) {
                alertError.textContent = 'Este usuario y teléfono ya están registrados. Intenta iniciar sesión.';
                alertError.style.display = 'block';
                return;
            }

            // Crear nuevo usuario
            const nuevoUsuario = {
                id: Date.now(),
                nombre: nombre,
                telefono: telefono
            };

            addUsuario(nuevoUsuario);
            setUsuario(nuevoUsuario);

            alertSuccess.textContent = '✓ Registro exitoso. Redirigiendo...';
            alertSuccess.style.display = 'block';

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }
    </script>
</body>
</html>
