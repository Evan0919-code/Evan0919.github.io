<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login - Depo Xona</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #FFFFFF 0%, #FFA500 50%, #FFFFFF 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 400px;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(221, 160, 221, 0.3);
        }

        .card-header {
            background: linear-gradient(135deg, #FFA500 0%, #DDA0DD 100%);
            color: white;
            border: none;
            border-radius: 15px 15px 0 0;
            padding: 30px;
            text-align: center;
        }

        .card-header h3 {
            margin: 0;
            font-weight: 700;
        }

        .btn-primary {
            background: linear-gradient(135deg, #FFA500 0%, #FFD700 100%) !important;
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #E69500 0%, #DDA0DD 100%) !important;
        }

        .form-control:focus {
            border-color: #DDA0DD;
            box-shadow: 0 0 0 0.2rem rgba(221, 160, 221, 0.25);
        }

        .alert {
            border-radius: 10px;
            border: none;
        }

        .form-label {
            color: #6b4a7f;
            font-weight: 600;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #6b4a7f;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h3><i class="bi bi-lock-fill"></i> Admin Login</h3>
            </div>
            <div class="card-body p-4">
                <form id="loginForm" onsubmit="handleAdminLogin(event)">
                    <div id="alertError" class="alert alert-danger" style="display:none;"></div>

                    <div class="mb-3">
                        <label for="usuario" class="form-label"><i class="bi bi-person"></i> Usuario</label>
                        <input type="text" class="form-control" id="usuario" name="usuario" required placeholder="Usuario administrativo">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label"><i class="bi bi-key"></i> Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" required placeholder="Contraseña">
                    </div>

                    <button type="submit" class="btn btn-primary mb-3">
                        <i class="bi bi-box-arrow-in-right"></i> Ingresar
                    </button>
                </form>

                <div class="alert alert-info small" role="alert">
                    <strong>Credenciales de prueba:</strong><br>
                    Usuario: <code>admin</code><br>
                    Contraseña: <code>admin123</code>
                </div>

                <div class="back-link">
                    <a href="../index.html"><i class="bi bi-house-fill"></i> Volver al inicio</a>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="../public/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const admin = getAdmin();
            if (admin) {
                window.location.href = 'dashboard.html';
            }
        });

        function handleAdminLogin(event) {
            event.preventDefault();

            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value.trim();
            const alertError = document.getElementById('alertError');

            if (!usuario || !password) {
                alertError.textContent = 'Completa todos los campos.';
                alertError.style.display = 'block';
                return;
            }

            const admin = verifyAdminCredentials(usuario, password);
            
            if (admin) {
                setAdmin(admin);
                window.location.href = 'dashboard.html';
            } else {
                alertError.textContent = 'Credenciales inválidas.';
                alertError.style.display = 'block';
            }
        }
    </script>
</body>
</html>
